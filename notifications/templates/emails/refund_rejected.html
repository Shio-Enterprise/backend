{% extends "emails/base.html" %}

{% block content %}
<p style="margin:0 0 16px;">Olá, {{ nome|default:"cliente" }}!</p>
<p style="margin:0 0 16px;">Seu pedido de reembolso referente ao pedido <strong>{{ pedido }}</strong> foi recusado.</p>
<p style="margin:0 0 16px;"><strong>Justificativa da loja:</strong><br>{{ refund.review_message|linebreaksbr }}</p>
<p style="margin:0 0 16px;">Se tiver dúvidas, fale com a loja.</p>
<p style="margin:24px 0;"><a href="{{ pedido_url }}" style="display:inline-block;background-color:#000000;color:#ffffff;padding:12px 24px;text-decoration:none;font-weight:700;">Ver pedido</a></p>
{% endblock %}
