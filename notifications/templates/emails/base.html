<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f4f4;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background-color:#ffffff;">
        <tr>
          <td align="center" style="background-color:#000000;padding:28px 24px;font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:700;letter-spacing:8px;color:#ffffff;">SHIO</td>
        </tr>
        <tr>
          <td style="padding:32px 24px;font-family:Inter,Arial,sans-serif;font-size:16px;line-height:1.5;color:#2d2d2d;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td align="center" style="background-color:#2d2d2d;padding:20px 24px;font-family:Inter,Arial,sans-serif;font-size:12px;line-height:1.5;color:#ffffff;">
            Este é um e-mail automático, por favor não responda.<br>
            &copy; {{ year }} Shio
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
