{% extends "emails/base.html" %}

{% block content %}
<p style="margin:0 0 16px;">Olá, {{ nome|default:"cliente" }}!</p>
<p style="margin:0 0 16px;">Recebemos a peça da sua troca referente ao pedido <strong>{{ pedido }}</strong>.</p>
<p style="margin:0 0 16px;">Você receberá outro e-mail com o código de rastreio da nova peça.</p>
<p style="margin:24px 0;"><a href="{{ pedido_url }}" style="display:inline-block;background-color:#000000;color:#ffffff;padding:12px 24px;text-decoration:none;font-weight:700;">Acompanhar pedido</a></p>
{% endblock %}
